server:
  port: 8059

spring:
  application:
    name: ebank-service
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:accounts-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  ai:
    mcp:
      server:
        protocol: STREAMABLE

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"